# Packaging: the Electron shell (asar) plus the Next standalone server as an
# unpacked resource, started by electron/main/next-server.ts.
appId: com.markcxx.cocomusic
productName: CoCo Music
copyright: Copyright © 2026 markcxx

directories:
  output: release
  buildResources: build

# Only the compiled shell goes into app.asar; Next ships as extraResources.
# The main process only needs Electron + Node built-ins, so no node_modules at
# all: the Next server brings its own traced dependencies (extraResources).
files:
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/**/*"

extraResources:
  - from: build/icon-mac.png
    to: icon-mac.png
  - from: build/icon.png
    to: icon.png
  # Menu-bar / tray / taskbar / jump list icons (electron/main/system-integration.ts).
  - from: build/tray
    to: tray
  # Copied from .next (not .next/standalone): electron-builder always drops a
  # top-level node_modules of `from`, which would strip the server's dependencies.
  - from: .next
    to: next
    filter:
      - standalone/**/*
      - "!standalone/**/.DS_Store"

asar: true
npmRebuild: false

# "Open with CoCo Music": registers the app for these audio types on install.
# macOS reads them into Info.plist (role Viewer = can open, never claims default);
# Windows NSIS writes ProgIDs so the app appears in "打开方式". The OS then
# launches/forwards paths: see electron/main/open-files.ts.
# Keep in sync with AUDIO_EXTENSIONS in electron/shared/ipc.ts.
fileAssociations:
  - ext: mp3
    name: MP3 Audio
    description: MP3 音频
    mimeType: audio/mpeg
    role: Viewer
  - ext: flac
    name: FLAC Audio
    description: FLAC 无损音频
    mimeType: audio/flac
    role: Viewer
  - ext: [m4a, aac]
    name: AAC Audio
    description: AAC / M4A 音频
    mimeType: audio/mp4
    role: Viewer
  - ext: wav
    name: WAV Audio
    description: WAV 音频
    mimeType: audio/wav
    role: Viewer
  - ext: [ogg, oga, opus]
    name: Ogg Audio
    description: Ogg / Opus 音频
    mimeType: audio/ogg
    role: Viewer

# Same naming on every platform: CoCo-Music-0.0.1-mac-arm64.dmg, …-win-x64-Setup.exe, …
artifactName: CoCo-Music-${version}-${os}-${arch}.${ext}

# No auto-publish from electron-builder; the release workflow uploads artifacts.
publish: null

mac:
  icon: build/icon.icns
  extendInfo:
    CFBundleIconName: CoCoMusic
  # Native layered icon for modern macOS; icon.icns remains the older-system fallback.
  extraFiles:
    - from: build/mac/Assets.car
      to: Resources/Assets.car
  category: public.app-category.music
  darkModeSupport: true
  # No Apple Developer ID yet: ad-hoc sign so Apple Silicon will launch the app
  # (an unsigned arm64 bundle is reported as "damaged"). Hardened runtime needs a
  # real identity, so it stays off until notarization is set up.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # The arch comes from the command line (--arm64 / --x64): each is built on a
  # native runner because the Next server ships platform-specific binaries.
  target:
    - dmg
    - zip

dmg:
  title: ${productName} ${version}
  artifactName: CoCo-Music-${version}-mac-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  # Associations write to HKCU without elevation in per-user installs.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: CoCo-Music-${version}-win-${arch}-Setup.${ext}

linux:
  icon: build/icon.png
  category: Audio
  executableName: cocomusic
  synopsis: 多平台音乐桌面播放器
  maintainer: markcxx
  vendor: markcxx
  desktop:
    entry:
      Name: CoCo Music
      Comment: 多平台音乐桌面播放器
      StartupWMClass: CoCo Music
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
