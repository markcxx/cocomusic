# Version tags publish automatically. A manual rebuild can package an existing tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: Existing version tag to rebuild and publish (empty for diagnostics)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.rebuild_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rebuild_tag && format('refs/tags/{0}', inputs.rebuild_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test release rules
        run: node --test .github/scripts/release.test.mjs
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ inputs.rebuild_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node .github/scripts/release.mjs validate

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
          - name: Windows (x64)
            os: windows-latest
            args: --win --x64
          - name: Linux (x64)
            os: ubuntu-24.04
            args: --linux --x64
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rebuild_tag && format('refs/tags/{0}', inputs.rebuild_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, test
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build app
        run: npm run build
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('electron/package.json').version")
          archive=$(node -p "'electron-v' + require('electron/package.json').version + '-' + process.platform + '-' + process.arch + '.zip'")
          asset=$(gh api "repos/electron/electron/releases/tags/v$version" | jq -er --arg name "$archive" '.assets[] | select(.name == $name) | .id')
          curl --fail --location --retry 3 --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/electron/electron/releases/assets/$asset?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$archive"
          node -e "const fs = require('node:fs'); const name = process.argv[1]; const digest = require('node:crypto').createHash('sha256').update(fs.readFileSync(name)).digest('hex'); require('node:assert/strict').equal(digest, require('electron/checksums.json')[name]);" "$archive"
          npx electron-builder ${{ matrix.args }} --config.electronDist="$archive" --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || inputs.rebuild_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rebuild_tag && format('refs/tags/{0}', inputs.rebuild_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.rebuild_tag || github.ref_name }}
        run: node .github/scripts/release.mjs publish

  cleanup:
    name: Remove temporary installers
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    # A cleanup outage must not mark a successfully published version as failed.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete this run's transferred artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("installers-")) | .id' |
          while read -r artifact; do
            gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact"
          done
