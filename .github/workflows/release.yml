# Build installers for macOS / Windows / Linux and attach them to a GitHub Release.
#
# Release:  git tag v0.0.1 && git push origin v0.0.1
#           → builds every platform, creates a *draft* release "CoCo Music 0.0.1"
#             with all installers; review it on GitHub and click Publish.
# Dry run:  Actions → Release → Run workflow (artifacts only, no release).
#
# Each platform is built on its own native runner: the bundled Next server
# carries platform-specific binaries, so cross-building is not reliable.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
          - name: Windows (x64)
            os: windows-latest
            args: --win --x64
          - name: Linux (x64)
            os: ubuntu-24.04
            args: --linux --x64
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # No code-signing certificates yet: never pick up a stray keychain identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, test
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CoCo Music $version" \
            --draft $prerelease \
            --generate-notes
